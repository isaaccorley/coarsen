[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "coarsen"
version = "0.1.0"
description = "Parallel polygon coverage simplification in Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Isaac Corley", email = "isaac.corley@proton.me"}]
dependencies = ["numpy", "shapely>=2.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "shapely==2.1.2"]
dev = ["maturin>=1.15,<2", "ruff", "ty", "pytest>=8", "pytest-cov", "shapely==2.1.2"]
benchmark = ["pyarrow", "pyproj"]

[tool.maturin]
python-source = "python"
module-name = "coarsen._core"
features = ["python"]
include = [{path = "tests/**", format = "sdist"}, {path = "benchmarks/**", format = "sdist"}]
exclude = ["dist/**", "**/__pycache__/**", "benchmarks/*.out"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["coarsen"]

[tool.ty.environment]
root = ["./python"]
