[package]
name = "coarsen"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"
description = "Ordered parallel port of GEOS 3.13.1 coverage simplification"
exclude = ["dist/", "benchmarks/*.out", "**/__pycache__/", "python/coarsen/*.so", "python/coarsen/*.pyd"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[dependencies]
anyhow = "1"
pyo3 = { version = "0.29.3", optional = true, features = ["abi3-py310", "extension-module"] }
rayon = "1.12"
rstar = "0.13"
rustc-hash = "2"

[dev-dependencies]
serde_json = "1"
