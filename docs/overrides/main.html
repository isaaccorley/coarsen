{% extends "base.html" %}
{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default(config.site_name, true) | e }} — coarsen">
  <meta property="og:description" content="{{ config.site_description | e }}">
  <meta property="og:url" content="{{ page.canonical_url | e }}">
  <meta property="og:image" content="{{ config.site_url }}assets/logo.png">
  <meta name="twitter:card" content="summary">
{% endblock %}
